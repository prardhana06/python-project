<!DOCTYPE html>
<html>
<head>
  <title>Login - Carrier Launch Pad</title>
  <style>
    body { background: radial-gradient(circle, #ffffff 0%, #a8d5ba 30%, #6fae8e 60%, #3e7f5c 100%); height: 100vh; margin: 0; font-family: Arial, sans-serif; }
    .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;}
    form { background: #fff; padding: 32px 24px; border-radius: 15px; box-shadow: 0 4px 16px rgba(51, 102, 81, 0.08); min-width: 300px; }
    input { margin-bottom: 18px; padding: 10px; border: 1px solid #6fae8e; border-radius: 8px; font-size: 1rem; width: 94%; }
    button { background: #903ae2; color: #fff; border: none; border-radius: 20px; padding: 10px 0; font-size: 1.1rem; cursor: pointer; }
    button:hover { background: #6fae8e;}
    .signup { text-align:center; margin-top:16px;}
  </style>
</head>
<body>
  <div class="container">
    <form id="loginForm" action="/login" method="POST">
      <h2>Welcome Back</h2>
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <div class="signup">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </form>
  </div>
  <script>
    // For AJAX validation, but form can POST to backend SQL
    // document.getElementById('loginForm').onsubmit = function(e) { e.preventDefault(); /* add AJAX */ }
  </script>
</body>
</html>
